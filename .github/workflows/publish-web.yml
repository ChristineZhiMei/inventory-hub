name: Publish Web resources

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-web.yml"
      - "apps/web/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes override; versions come from apps/web/package.json"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check Web release
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
      min_desktop_version: ${{ steps.release.outputs.min_desktop_version }}
      release_notes: ${{ steps.release.outputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Web release configuration
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
        with:
          script: |
            const fs = require('node:fs');
            const web = JSON.parse(fs.readFileSync('apps/web/package.json', 'utf8'));
            const desktop = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8'));
            const version = web.version;
            const minimum = web.inventoryHub?.minDesktopVersion;
            const versionPattern = /^\d+\.\d+\.\d+$/;
            if (![version, minimum, desktop.version].every(value => typeof value === 'string' && versionPattern.test(value))) {
              throw new Error('Web and minimum compatible desktop versions must be explicitly configured');
            }
            const required = minimum.split('.').map(Number);
            const available = desktop.version.split('.').map(Number);
            const difference = required.map((part, index) => part - available[index]).find(value => value !== 0) ?? 0;
            if (difference > 0) throw new Error('Minimum compatible desktop version exceeds the configured desktop version');
            core.setOutput('version', version);
            core.setOutput('min_desktop_version', minimum);
            core.setOutput('release_notes', process.env.RELEASE_NOTES_OVERRIDE || web.inventoryHub?.releaseNotes || '界面功能与体验更新');
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: `web-v${version}` });
              core.notice(`Web ${version} already has a release; skipping publication. Increment the Web version to publish changes.`);
              core.setOutput('should_publish', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('should_publish', 'true');
            }

  publish:
    name: Web ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      INVENTORY_HUB_WEB_VERSION: ${{ needs.prepare.outputs.version }}
      INVENTORY_HUB_MIN_DESKTOP_VERSION: ${{ needs.prepare.outputs.min_desktop_version }}
      INVENTORY_HUB_WEB_RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build Web
        run: pnpm build:contracts && pnpm --filter @inventory-hub/web typecheck && pnpm build:web

      - name: Package Web resources
        run: pnpm --filter @inventory-hub/web package:release

      - name: Publish Web release
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_VERSION: ${{ needs.prepare.outputs.version }}
          MIN_DESKTOP_VERSION: ${{ needs.prepare.outputs.min_desktop_version }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        run: |
          set -euo pipefail
          tag="web-v${WEB_VERSION}"
          notes_path="${RUNNER_TEMP}/inventory-hub-web-release-notes.md"
          printf '%s\n\n%s\n\n- [下载 Windows 客户端](https://github.com/${{ github.repository }}/releases/tag/v%s)\n' \
            "${RELEASE_NOTES}" \
            "适用于 Inventory Hub ${MIN_DESKTOP_VERSION} 及以上兼容版本。" \
            "${MIN_DESKTOP_VERSION}" > "${notes_path}"
          mapfile -t assets < <(find apps/web/release -maxdepth 1 -type f \( -name '*.ihweb' -o -name '*.json' \) -print)
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "Expected one .ihweb package and one .json metadata file." >&2
            exit 1
          fi
          gh release create "${tag}" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Inventory Hub Web ${WEB_VERSION}" \
            --notes-file "${notes_path}" \
            --latest=false
