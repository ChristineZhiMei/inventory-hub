name: Package desktop

on:
  push:
    branches:
      - "feat/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update the GitHub Release for the desktop version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: package-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build workspace
        run: pnpm build

      - name: Package Web release
        shell: pwsh
        run: |
          $desktop = Get-Content "apps/desktop/package.json" | ConvertFrom-Json
          $web = Get-Content "apps/web/package.json" | ConvertFrom-Json
          pnpm --filter @inventory-hub/web package:release -- `
            --version $web.version `
            --min-desktop $desktop.version `
            --notes "支持独立更新界面资源，客户端改动请查看本版本安装包。"

      - name: Package desktop
        run: pnpm --filter @inventory-hub/desktop run package:win:x64

      - name: Upload desktop artifacts
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: inventory-hub-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/web/release/*.ihweb
            apps/web/release/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content "apps/desktop/package.json" | ConvertFrom-Json
          $tag = "v$($package.version)"
          $assets = @(
            Get-ChildItem "apps/desktop/release" -File |
              Where-Object { $_.Extension -in ".exe", ".zip", ".blockmap" }
            Get-ChildItem "apps/web/release" -File |
              Where-Object { $_.Extension -in ".ihweb", ".json" }
          )

          if (-not $assets) {
            throw "No Windows release assets were generated."
          }

          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets.FullName `
              --repo "${{ github.repository }}" `
              --clobber
          } else {
            $notesPath = Join-Path $env:RUNNER_TEMP "inventory-hub-release-notes.md"
            @"
          本版本包含新的 Windows 客户端和可独立导入的 Web 界面资源包。

          - Windows 客户端：安装后可在“设置 → 关于与健康 → 界面更新”中更新界面。
          - Web 资源包：适用于 Inventory Hub $tag 及兼容的新版本客户端。
          "@ | Set-Content -Path $notesPath -Encoding utf8
            gh release create $tag $assets.FullName `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Inventory Hub $tag" `
              --notes-file $notesPath
          }
