name: Package desktop

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/package-desktop.yml"
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "packages/core/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a new desktop version without replacing an existing release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: package-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Check desktop release
    runs-on: ubuntu-24.04
    outputs:
      should_package: ${{ steps.release.outputs.should_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check desktop version
        id: release
        uses: actions/github-script@v7
        env:
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_release }}
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid desktop version');
            if (process.env.BUILD_ONLY === 'true') {
              core.setOutput('should_package', 'true');
              return;
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: `v${version}` });
              core.notice(`Desktop ${version} already has a release; skipping packaging and publication.`);
              core.setOutput('should_package', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('should_package', 'true');
            }

  package:
    name: Windows x64
    needs: prepare
    if: ${{ needs.prepare.outputs.should_package == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build workspace
        run: pnpm build

      - name: Package desktop
        run: pnpm --filter @inventory-hub/desktop run package:win:x64

      - name: Upload desktop artifacts
        if: ${{ github.event_name != 'push' && !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: inventory-hub-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content "apps/desktop/package.json" | ConvertFrom-Json
          $tag = "v$($package.version)"
          $assets = @(
            Get-ChildItem "apps/desktop/release" -File |
              Where-Object { $_.Extension -in ".exe", ".zip", ".blockmap" }
          )

          if (-not $assets) {
            throw "No Windows release assets were generated."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "inventory-hub-release-notes.md"
          @"
          本版本包含新的 Windows 客户端安装包。

          - Windows 客户端：安装后可在“设置 → 关于与健康 → 界面更新”中更新界面。
          - Web 界面资源独立发布，兼容要求以对应 Web 版本说明为准。
          "@ | Set-Content -Path $notesPath -Encoding utf8
          gh release create $tag $assets.FullName `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Inventory Hub $tag" `
            --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop release publication failed; existing releases are never overwritten."
          }
